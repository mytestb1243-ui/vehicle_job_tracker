<nav class="navbar">
  <a href="/dashboard" class="navbar-brand">
    <span class="brand-dot"></span> {{ app_name }}
  </a>

  <div class="navbar-links">
    <a href="/dashboard" class="nav-link {{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
    <a href="/search" class="nav-link {{ 'active' if active_page == 'search' else '' }}">Search</a>
    {% if user.is_admin_level %}
    <a href="/admin" class="nav-link {{ 'active' if active_page == 'admin' else '' }}">Admin Panel</a>
    {% endif %}
  </div>

  <div class="navbar-user">
    <div class="user-chip">
      <span class="user-avatar">{{ (user.full_name or user.username)[0]|upper }}</span>
      <div>
        <div>{{ user.full_name or user.username }}</div>
        <span class="role-badge">{{ user.role | role_label }}</span>
      </div>
    </div>
    <a href="/logout" class="logout-btn">Sign out</a>
  </div>
</nav>
