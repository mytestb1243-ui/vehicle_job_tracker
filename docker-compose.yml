name: vjt

services:
  db:
    image: postgres:16
    container_name: vjt-db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vjt_pgdata:/var/lib/postgresql/data
    networks:
      - vjt_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: vjt-web
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - vjt_net

volumes:
  vjt_pgdata:

networks:
  vjt_net:
    name: vjt_net